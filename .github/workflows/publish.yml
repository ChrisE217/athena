name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Do not set registry-url — it writes an empty NODE_AUTH_TOKEN into .npmrc
      # and breaks Trusted Publisher OIDC (npm returns 404 on publish).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm publish --provenance --access public
