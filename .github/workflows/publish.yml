name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm ≥ 11.5.1 (required for Trusted Publisher OIDC)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` which expands empty and
      # blocks OIDC. Strip it so npm uses Trusted Publisher instead.
      - name: Enable Trusted Publisher OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          node --version
          npm --version

      - run: npm ci
      - run: npm run build
      # ignore-scripts: already built; avoids prepublishOnly/prepack double-build
      - run: npm publish --provenance --access public --ignore-scripts
